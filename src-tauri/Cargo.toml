[package]
name = "gpt-powershell-loop"
version = "0.1.0"
description = "Local ChatGPT to PowerShell loop bridge"
authors = ["GPT-POWERSHELL.loop contributors"]
edition = "2021"

[lib]
name = "gpt_powershell_loop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
